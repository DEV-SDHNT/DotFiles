backend="glx";

vsync=true;

opacity-rule=[
        "80:class_g='Rofi'",
        "90:class_g='Emacs'"
];

shadow=true;
shadow-radius=10;
shadow-offset-x=-13;
shadow-offset-y=-13;
shadow-opacity=0.5;
shadow-color="#000000";

fading=true;
fade-in-step=0.03;
fade-out-step=0.1;
fade-delta=5;

animations=true;

frame-opacity=1.0;
inactive-opacity=0.80;

